<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiển Thị Tên Tự Động</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f6f8;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            height: 80px;
            padding: 8px;
            border: 2px solid #cccccc;
            border-radius: 8px;
            font-size: 13px;
            text-transform: uppercase;
            resize: none;
        }

        textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 10px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:active { transform: scale(0.98); }
        .btn-order { background-color: #007bff; }
        .btn-order:hover { background-color: #0056b3; }
        .btn-shuffle { background-color: #28a745; }
        .btn-shuffle:hover { background-color: #1e7e34; }
        .btn-split { background-color: #6f42c1; }
        .btn-split:hover { background-color: #593196; }
        .btn-mini { background-color: #fd7e14; width: 100%; margin-top: 2px; }
        .btn-mini:hover { background-color: #e06b00; }

        /* Khung hiển thị tổng */
        .display-container {
            width: 100%;
            flex: 1;
            display: flex;
            gap: 8px;
        }

        /* Ô hiển thị tên */
        .display-box {
            position: relative;
            flex: 1;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e9ecef;
            border: 2px dashed #6c757d;
            border-radius: 10px;
            font-size: clamp(16px, 6vw, 42px);
            font-weight: bold;
            color: #111111;
            text-align: center;
            word-break: break-word;
            padding: 25px 8px 8px 8px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.3s;
        }

        .display-box:active { transform: scale(0.99); }

        .round-tag {
            position: absolute;
            top: 6px;
            left: 8px;
            font-size: clamp(9px, 2.5vw, 12px);
            font-weight: bold;
            background: rgba(0, 0, 0, 0.15);
            color: #222;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Khi màn hình nhỏ hoặc là Cửa sổ Siêu Nhỏ -> Ẩn phần controls */
        @media (max-width: 450px), (max-height: 300px) {
            body { padding: 0; }
            .controls { display: none !important; }
            .container {
                padding: 0;
                box-shadow: none;
                background: transparent;
                max-width: 100%;
                max-height: 100%;
                border-radius: 0;
            }
            .display-container {
                gap: 2px;
            }
            .display-box {
                height: 100vh;
                border-radius: 0;
                border: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Phần nhập liệu -->
        <div class="controls">
            <div class="input-row">
                <textarea id="nameInputA" placeholder="CỘT A (Mỗi dòng 1 tên)..." oninput="forceUppercase(this)"></textarea>
                <textarea id="nameInputB" placeholder="CỘT B (Nút chia đôi ô)..." style="display: none;" oninput="forceUppercase(this)"></textarea>
            </div>
            <div class="btn-group">
                <button class="btn-order" onclick="setModeAndNext('order')">Hiện Theo Thứ Tự</button>
                <button class="btn-shuffle" onclick="setModeAndNext('shuffle')">Hiện Xáo Trộn</button>
                <button class="btn-split" onclick="toggleSplit()">↔️ Chia Đôi / Gộp Ô</button>
            </div>
            <button class="btn-mini" onclick="openMiniWindow()">🔲 Mở Cửa Sổ Siêu Nhỏ</button>
        </div>

        <!-- Khung hiển thị tên (1 hoặc 2 ô) -->
        <div class="display-container" id="displayContainer">
            <!-- Ô A -->
            <div class="display-box" id="displayBoxA" onclick="triggerNextName('A')">
                <span class="round-tag" id="roundTagA">Vòng A: 0</span>
                <span id="nameTextA">--- CỘT A ---</span>
            </div>
            <!-- Ô B (Ẩn mặc định) -->
            <div class="display-box" id="displayBoxB" style="display: none;" onclick="triggerNextName('B')">
                <span class="round-tag" id="roundTagB">Vòng B: 0</span>
                <span id="nameTextB">--- CỘT B ---</span>
            </div>
        </div>
    </div>

    <script>
        let isSplit = false; // Trạng thái chia đôi ô
        let currentMode = 'order';

        // Dữ liệu riêng biệt cho Cột A và Cột B
        const state = {
            A: { currentIndex: 0, orderRound: 1, shuffledPool: [], shuffleRound: 1, color: "#e9ecef" },
            B: { currentIndex: 0, orderRound: 1, shuffledPool: [], shuffleRound: 1, color: "#e9ecef" }
        };

        const bgColors = [
            "#FFD1DC", "#FFDFBA", "#FFFFBA", "#BAFFC9", "#BAE1FF",
            "#E8AEFF", "#D5AAFF", "#C4FAF8", "#B5EAD7", "#E2F0CB",
            "#FFDAC1", "#FFB7B2", "#E0FEFE", "#C7CEEA", "#F3E5F5"
        ];

        const channel = new BroadcastChannel('name_picker_channel');

        function forceUppercase(element) { element.value = element.value.toUpperCase(); }

        function getNamesList(column) {
            const inputId = column === 'A' ? 'nameInputA' : 'nameInputB';
            return document.getElementById(inputId).value.split('\n').map(n => n.trim()).filter(n => n.length > 0);
        }

        function changeDisplayColor(col) {
            state[col].color = bgColors[Math.floor(Math.random() * bgColors.length)];
            document.getElementById(`displayBox${col}`).style.backgroundColor = state[col].color;
        }

        // Bật / Tắt chế độ chia đôi ô
        function toggleSplit() {
            isSplit = !isSplit;
            const boxB = document.getElementById('displayBoxB');
            const inputB = document.getElementById('nameInputB');

            if (isSplit) {
                boxB.style.display = 'flex';
                inputB.style.display = 'block';
            } else {
                boxB.style.display = 'none';
                inputB.style.display = 'none';
            }
            broadcastState();
        }

        function setModeAndNext(mode) {
            currentMode = mode;
            showNext('A');
            if (isSplit) showNext('B');
        }

        function triggerNextName(col) {
            showNext(col);
        }

        function showNext(col) {
            if (currentMode === 'order') showNextOrdered(col);
            else showNextShuffled(col);
            broadcastState();
        }

        function showNextOrdered(col) {
            const names = getNamesList(col);
            const nameText = document.getElementById(`nameText${col}`);
            const roundTag = document.getElementById(`roundTag${col}`);
            const st = state[col];

            if (names.length === 0) {
                nameText.innerText = `CHƯA NHẬP ${col}!`;
                roundTag.innerText = `Vòng ${col}: 0`;
                return;
            }

            if (st.currentIndex >= names.length) {
                st.currentIndex = 0;
                st.orderRound++;
            }

            nameText.innerText = names[st.currentIndex];
            roundTag.innerText = `Vòng ${col}: ${st.orderRound}`;
            st.currentIndex++;
            changeDisplayColor(col);
        }

        function showNextShuffled(col) {
            const names = getNamesList(col);
            const nameText = document.getElementById(`nameText${col}`);
            const roundTag = document.getElementById(`roundTag${col}`);
            const st = state[col];

            if (names.length === 0) {
                nameText.innerText = `CHƯA NHẬP ${col}!`;
                roundTag.innerText = `Vòng ${col}: 0`;
                st.shuffledPool = [];
                return;
            }

            if (st.shuffledPool.length === 0) {
                if (!nameText.innerText.includes("--- CỘT") && !nameText.innerText.includes("CHƯA NHẬP")) {
                    st.shuffleRound++;
                }
                st.shuffledPool = [...names];
                for (let i = st.shuffledPool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [st.shuffledPool[i], st.shuffledPool[j]] = [st.shuffledPool[j], st.shuffledPool[i]];
                }
            }

            nameText.innerText = st.shuffledPool.pop();
            roundTag.innerText = `Vòng ${col}: ${st.shuffleRound}`;
            changeDisplayColor(col);
        }

        // Đồng bộ dữ liệu với cửa sổ siêu nhỏ
        function broadcastState() {
            channel.postMessage({
                isSplit: isSplit,
                currentMode: currentMode,
                nameA: document.getElementById('nameTextA').innerText,
                roundA: document.getElementById('roundTagA').innerText,
                nameB: document.getElementById('nameTextB').innerText,
                roundB: document.getElementById('roundTagB').innerText,
                inputA: document.getElementById('nameInputA').value,
                inputB: document.getElementById('nameInputB').value,
                state: state
            });
        }

        channel.onmessage = (event) => {
            const data = event.data;
            if (data.action === 'NEXT') {
                showNext(data.column);
            } else {
                isSplit = data.isSplit;
                currentMode = data.currentMode;
                
                document.getElementById('displayBoxB').style.display = isSplit ? 'flex' : 'none';
                document.getElementById('nameInputB').style.display = isSplit ? 'block' : 'none';

                document.getElementById('nameTextA').innerText = data.nameA;
                document.getElementById('roundTagA').innerText = data.roundA;
                document.getElementById('nameTextB').innerText = data.nameB;
                document.getElementById('roundTagB').innerText = data.roundB;

                document.getElementById('nameInputA').value = data.inputA;
                document.getElementById('nameInputB').value = data.inputB;

                document.getElementById('displayBoxA').style.backgroundColor = data.state.A.color;
                document.getElementById('displayBoxB').style.backgroundColor = data.state.B.color;

                Object.assign(state.A, data.state.A);
                Object.assign(state.B, data.state.B);
            }
        };

        // Reset riêng khi sửa nội dung nhập liệu
        ['A', 'B'].forEach(col => {
            document.getElementById(`nameInput${col}`).addEventListener('input', function() {
                state[col].currentIndex = 0;
                state[col].orderRound = 1;
                state[col].shuffledPool = [];
                state[col].shuffleRound = 1;
                document.getElementById(`roundTag${col}`).innerText = `Vòng ${col}: 0`;
                document.getElementById(`nameText${col}`).innerText = `--- CỘT ${col} ---`;
                broadcastState();
            });
        });

        function openMiniWindow() {
            window.open(
                window.location.href, 
                'MiniNamePicker', 
                'width=320,height=160,resizable=yes,scrollbars=no,status=no,toolbar=no,menubar=no'
            );
            setTimeout(broadcastState, 500);
        }

        // Xử lý sự kiện click khi chạy ở Cửa sổ Siêu Nhỏ
        if (window.name === 'MiniNamePicker') {
            document.getElementById('displayBoxA').onclick = function() {
                if (window.opener && !window.opener.closed) channel.postMessage({ action: 'NEXT', column: 'A' });
                else showNext('A');
            };
            document.getElementById('displayBoxB').onclick = function() {
                if (window.opener && !window.opener.closed) channel.postMessage({ action: 'NEXT', column: 'B' });
                else showNext('B');
            };
        }
    </script>
</body>
</html>
