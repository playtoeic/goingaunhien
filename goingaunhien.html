<script>
        // Thay ID Google Sheet của bạn vào đây
        const SHEET_ID = "1-aZa_8s-Wi_4Lca9q0aDTOXmIx846EjpZ9gcaOK7joI";
        // Lấy dữ liệu dạng CSV từ Sheet đầu tiên (gid=0 hoặc tùy chỉnh)
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

        let isSplit = false;
        let currentMode = 'order';

        const state = {
            A: { currentIndex: 0, orderRound: 1, shuffledPool: [], shuffleRound: 1, color: "#e9ecef" },
            B: { currentIndex: 0, orderRound: 1, shuffledPool: [], shuffleRound: 1, color: "#e9ecef" }
        };

        const bgColors = [
            "#FFD1DC", "#FFDFBA", "#FFFFBA", "#BAFFC9", "#BAE1FF",
            "#E8AEFF", "#D5AAFF", "#C4FAF8", "#B5EAD7", "#E2F0CB",
            "#FFDAC1", "#FFB7B2", "#E0FEFE", "#C7CEEA", "#F3E5F5"
        ];

        const channel = new BroadcastChannel('name_picker_channel');

        // Hàm đọc trực tiếp Google Sheet qua CSV (Không bị lỗi CORS)
        async function loadClassData() {
            const classCode = document.getElementById('classCodeInput').value.trim();
            if (!classCode) return alert("Vui lòng nhập tên lớp!");

            const btn = document.querySelector('.class-selector button');
            btn.innerText = "⏳ Đang tải...";
            btn.disabled = true;

            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                
                // Phân tách CSV thành các dòng và cột
                const rows = parseCSV(csvText);
                const names = [];
                let currentClass = "";

                for (let i = 0; i < rows.length; i++) {
                    const cellClass = (rows[i][0] || "").trim();
                    const name = (rows[i][1] || "").trim();

                    // Xử lý gộp ô (nếu dòng dưới để trống ô lớp, nó sẽ tự động lấy lớp của dòng trên)
                    if (cellClass !== "") {
                        currentClass = cellClass;
                    }

                    if (currentClass.toUpperCase() === classCode.toUpperCase() && name !== "" && name.toUpperCase() !== "TÊN") {
                        names.push(name);
                    }
                }

                if (names.length > 0) {
                    const textareaA = document.getElementById('nameInputA');
                    textareaA.value = names.join('\n').toUpperCase();
                    textareaA.dispatchEvent(new Event('input'));
                } else {
                    alert(`Không tìm thấy học viên nào trong lớp ${classCode}`);
                }
            } catch (err) {
                alert("Lỗi tải dữ liệu từ Google Sheets! Hãy kiểm tra lại quyền chia sẻ file Sheet.");
                console.error(err);
            } finally {
                btn.innerText = "📥 Lấy tên lớp";
                btn.disabled = false;
            }
        }

        // Hàm hỗ trợ phân tách chuỗi CSV chuẩn xác (xử lý cả dấu phẩy trong tên nếu có)
        function parseCSV(text) {
            let lines = text.split("\n");
            let result = [];
            for (let i = 0; i < lines.length; i++) {
                let row = [];
                let inQuotes = false;
                let entry = "";
                for (let c = 0; c < lines[i].length; c++) {
                    let char = lines[i][c];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(entry);
                        entry = "";
                    } else {
                        entry += char;
                    }
                }
                row.push(entry);
                result.push(row);
            }
            return result;
        }

        function forceUppercase(element) { element.value = element.value.toUpperCase(); }

        function getNamesList(column) {
            const inputId = column === 'A' ? 'nameInputA' : 'nameInputB';
            return document.getElementById(inputId).value.split('\n').map(n => n.trim()).filter(n => n.length > 0);
        }

        function changeDisplayColor(col) {
            state[col].color = bgColors[Math.floor(Math.random() * bgColors.length)];
            document.getElementById(`displayBox${col}`).style.backgroundColor = state[col].color;
        }

        function toggleSplit() {
            isSplit = !isSplit;
            document.getElementById('displayBoxB').style.display = isSplit ? 'flex' : 'none';
            document.getElementById('nameInputB').style.display = isSplit ? 'block' : 'none';
            broadcastState();
        }

        function setModeAndNext(mode) {
            currentMode = mode;
            showNext('A');
            if (isSplit) showNext('B');
        }

        function triggerNextName(col) { showNext(col); }

        function showNext(col) {
            if (currentMode === 'order') showNextOrdered(col);
            else showNextShuffled(col);
            broadcastState();
        }

        function showNextOrdered(col) {
            const names = getNamesList(col);
            const nameText = document.getElementById(`nameText${col}`);
            const roundTag = document.getElementById(`roundTag${col}`);
            const st = state[col];

            if (names.length === 0) {
                nameText.innerText = `CHƯA NHẬP ${col}!`;
                roundTag.innerText = `Vòng ${col}: 0`;
                return;
            }

            if (st.currentIndex >= names.length) {
                st.currentIndex = 0;
                st.orderRound++;
            }

            nameText.innerText = names[st.currentIndex];
            roundTag.innerText = `Vòng ${col}: ${st.orderRound}`;
            st.currentIndex++;
            changeDisplayColor(col);
        }

        function showNextShuffled(col) {
            const names = getNamesList(col);
            const nameText = document.getElementById(`nameText${col}`);
            const roundTag = document.getElementById(`roundTag${col}`);
            const st = state[col];

            if (names.length === 0) {
                nameText.innerText = `CHƯA NHẬP ${col}!`;
                roundTag.innerText = `Vòng ${col}: 0`;
                st.shuffledPool = [];
                return;
            }

            if (st.shuffledPool.length === 0) {
                if (!nameText.innerText.includes("--- CỘT") && !nameText.innerText.includes("CHƯA NHẬP")) {
                    st.shuffleRound++;
                }
                st.shuffledPool = [...names];
                for (let i = st.shuffledPool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [st.shuffledPool[i], st.shuffledPool[j]] = [st.shuffledPool[j], st.shuffledPool[i]];
                }
            }

            nameText.innerText = st.shuffledPool.pop();
            roundTag.innerText = `Vòng ${col}: ${st.shuffleRound}`;
            changeDisplayColor(col);
        }

        function broadcastState() {
            channel.postMessage({
                isSplit: isSplit,
                currentMode: currentMode,
                nameA: document.getElementById('nameTextA').innerText,
                roundA: document.getElementById('roundTagA').innerText,
                nameB: document.getElementById('nameTextB').innerText,
                roundB: document.getElementById('roundTagB').innerText,
                inputA: document.getElementById('nameInputA').value,
                inputB: document.getElementById('nameInputB').value,
                state: state
            });
        }

        channel.onmessage = (event) => {
            const data = event.data;
            if (data.action === 'NEXT') {
                showNext(data.column);
            } else {
                isSplit = data.isSplit;
                currentMode = data.currentMode;
                document.getElementById('displayBoxB').style.display = isSplit ? 'flex' : 'none';
                document.getElementById('nameInputB').style.display = isSplit ? 'block' : 'none';
                document.getElementById('nameTextA').innerText = data.nameA;
                document.getElementById('roundTagA').innerText = data.roundA;
                document.getElementById('nameTextB').innerText = data.nameB;
                document.getElementById('roundTagB').innerText = data.roundB;
                document.getElementById('nameInputA').value = data.inputA;
                document.getElementById('nameInputB').value = data.inputB;
                document.getElementById('displayBoxA').style.backgroundColor = data.state.A.color;
                document.getElementById('displayBoxB').style.backgroundColor = data.state.B.color;
                Object.assign(state.A, data.state.A);
                Object.assign(state.B, data.state.B);
            }
        };

        ['A', 'B'].forEach(col => {
            document.getElementById(`nameInput${col}`).addEventListener('input', function() {
                state[col].currentIndex = 0;
                state[col].orderRound = 1;
                state[col].shuffledPool = [];
                state[col].shuffleRound = 1;
                document.getElementById(`roundTag${col}`).innerText = `Vòng ${col}: 0`;
                document.getElementById(`nameText${col}`).innerText = `--- CỘT ${col} ---`;
                broadcastState();
            });
        });

        function openMiniWindow() {
            window.open(
                window.location.href, 
                'MiniNamePicker', 
                'width=320,height=160,resizable=yes,scrollbars=no,status=no,toolbar=no,menubar=no'
            );
            setTimeout(broadcastState, 500);
        }

        if (window.name === 'MiniNamePicker') {
            document.getElementById('displayBoxA').onclick = function() {
                if (window.opener && !window.opener.closed) channel.postMessage({ action: 'NEXT', column: 'A' });
                else showNext('A');
            };
            document.getElementById('displayBoxB').onclick = function() {
                if (window.opener && !window.opener.closed) channel.postMessage({ action: 'NEXT', column: 'B' });
                else showNext('B');
            };
        }
    </script>
